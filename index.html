<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Shijie Zhou</title>
  <meta name="description" content="Selected photographs by Shijie Zhou.">
  <meta name="theme-color" content="#f9f7f4">
  <link rel="icon" href="assets/sz-mark.svg" type="image/svg+xml">
  <script>
    // 默认浅色；用户手动选过深色时切换（CSS 加载前执行，避免闪烁）
    (function () {
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#contents">Skip to contents</a>

  <!-- 深色模式下的星空；浅色模式下隐藏 -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="topbar" id="topbar">
    <a class="brand" href="#top">
      <img class="brand-mark" src="assets/sz-mark.svg" alt="" width="28" height="28">
      <span class="brand-name" id="brandName"></span>
    </a>
    <nav class="topbar-nav" aria-label="Site">
      <a class="topbar-link" id="homeLink" href="#">About</a>
      <button class="index-toggle" id="indexToggle" aria-expanded="false" aria-controls="indexOverlay">Index</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="tt-icon" viewBox="0 0 24 24" aria-hidden="true">
          <mask id="ttMoonMask">
            <rect width="24" height="24" fill="white"/>
            <circle class="tt-mask-circle" cx="12" cy="12" r="6" fill="black"/>
          </mask>
          <circle class="tt-core" cx="12" cy="12" r="5.2" fill="currentColor" mask="url(#ttMoonMask)"/>
          <g class="tt-rays" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="12" y1="1.8" x2="12" y2="4.2"/>
            <line x1="12" y1="19.8" x2="12" y2="22.2"/>
            <line x1="1.8" y1="12" x2="4.2" y2="12"/>
            <line x1="19.8" y1="12" x2="22.2" y2="12"/>
            <line x1="4.6" y1="4.6" x2="6.3" y2="6.3"/>
            <line x1="17.7" y1="17.7" x2="19.4" y2="19.4"/>
            <line x1="17.7" y1="6.3" x2="19.4" y2="4.6"/>
            <line x1="4.6" y1="19.4" x2="6.3" y2="17.7"/>
          </g>
        </svg>
      </button>
    </nav>
  </header>

  <nav class="index-overlay" id="indexOverlay" aria-hidden="true" aria-label="Series index">
    <ol class="index-list" id="indexList"></ol>
  </nav>

  <!-- 右侧编号导轨（宽屏） -->
  <nav class="rail" id="rail" aria-label="Series"></nav>

  <main id="top">
    <div id="home">
    <section class="intro" id="hero">
      <div class="intro-text">
        <p class="eyebrow">Photography</p>
        <h1 class="intro-title" id="introTitle"></h1>
        <p class="intro-statement" id="introStatement"></p>
        <p class="intro-stats" id="introStats"></p>
      </div>
      <nav class="contents" id="contents" aria-label="Contents">
        <p class="eyebrow">Contents</p>
        <ol class="contents-list" id="contentsList"></ol>
      </nav>
    </section>

    <div id="seriesRoot"></div>
    </div>

    <!-- 系列页（#/slug）：该系列全部照片 -->
    <section class="series-page" id="seriesPage" hidden></section>
  </main>

  <footer class="site-footer">
    <img class="footer-mark" src="assets/sz-mark.svg" alt="" width="36" height="36">
    <p class="footer-name" id="footerName"></p>
    <p class="footer-statement" id="footerStatement"></p>
    <nav class="footer-links" id="footerLinks"></nav>
    <p class="footer-copy" id="footerCopy"></p>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photograph viewer">
    <button class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <figure class="lb-figure">
      <div class="lb-media" id="lbMedia"></div>
      <figcaption class="lb-caption">
        <div class="lb-line"><span class="lb-title" id="lbTitle"></span><span class="lb-meta" id="lbMeta"></span></div>
        <div class="lb-exif" id="lbExif"></div>
      </figcaption>
    </figure>
    <div class="lb-strip" id="lbStrip" aria-label="Photographs in this series"></div>
  </div>

  <script src="js/site.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
