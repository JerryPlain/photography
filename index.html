<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shijie Zhou — Photography</title>
  <meta name="description" content="Selected photographs by Shijie Zhou — cities, water, machines, and the light that stayed.">
  <meta name="theme-color" content="#0b0c10">
  <script>
    // 默认深色；仅当用户手动选过浅色时切换（CSS 加载前执行，避免闪烁）
    (function () {
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#contents">Skip to contents</a>

  <!-- 星空（固定在最底层，滚动后渐隐） -->
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <a class="wordmark" href="#top" id="wordmark"></a>
    <div class="topbar-now" id="topbarNow" aria-live="polite"></div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light mode" title="Toggle light mode">
        <svg class="tt-icon" viewBox="0 0 24 24" aria-hidden="true">
          <mask id="ttMoonMask">
            <rect width="24" height="24" fill="white"/>
            <circle class="tt-mask-circle" cx="12" cy="12" r="6" fill="black"/>
          </mask>
          <circle class="tt-core" cx="12" cy="12" r="5.2" fill="currentColor" mask="url(#ttMoonMask)"/>
          <g class="tt-rays" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="12" y1="1.8" x2="12" y2="4.2"/>
            <line x1="12" y1="19.8" x2="12" y2="22.2"/>
            <line x1="1.8" y1="12" x2="4.2" y2="12"/>
            <line x1="19.8" y1="12" x2="22.2" y2="12"/>
            <line x1="4.6" y1="4.6" x2="6.3" y2="6.3"/>
            <line x1="17.7" y1="17.7" x2="19.4" y2="19.4"/>
            <line x1="17.7" y1="6.3" x2="19.4" y2="4.6"/>
            <line x1="4.6" y1="19.4" x2="6.3" y2="17.7"/>
          </g>
        </svg>
      </button>
      <button class="index-toggle" id="indexToggle" aria-expanded="false" aria-controls="indexOverlay">
        <span class="index-toggle-label">Index</span>
        <span class="index-toggle-lines" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </header>

  <nav class="index-overlay" id="indexOverlay" aria-hidden="true">
    <ol class="index-list" id="indexList"></ol>
    <p class="index-foot" id="indexFoot"></p>
  </nav>

  <main id="top">
    <section class="hero" id="hero">
      <p class="hero-kicker reveal" id="heroKicker"></p>
      <h1 class="hero-title reveal" id="heroAuthor"></h1>
      <p class="hero-sub reveal" id="heroSub"></p>
      <p class="hero-statement reveal" id="heroStatement"></p>
      <p class="hero-stats reveal" id="heroStats"></p>
      <a class="scroll-cue" href="#contents" aria-label="Scroll to contents">
        <span class="scroll-cue-line"></span>
      </a>
    </section>

    <nav class="contents" id="contents" aria-label="Series index">
      <p class="section-label reveal">Contents</p>
      <ol class="contents-list" id="contentsList"></ol>
    </nav>

    <div id="seriesRoot"></div>
  </main>

  <footer class="site-footer">
    <p class="footer-name" id="footerName"></p>
    <p class="footer-statement" id="footerStatement"></p>
    <nav class="footer-links" id="footerLinks"></nav>
    <p class="footer-copy" id="footerCopy"></p>
    <a class="back-top" href="#top">Back to top</a>
  </footer>

  <!-- 目录 hover 时跟随光标的封面预览 -->
  <div class="peek" id="peek" aria-hidden="true"><img alt=""></div>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photograph viewer">
    <button class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <figure class="lb-figure">
      <div class="lb-media" id="lbMedia"></div>
      <figcaption class="lb-caption">
        <span class="lb-title" id="lbTitle"></span>
        <span class="lb-meta" id="lbMeta"></span>
      </figcaption>
    </figure>
  </div>

  <script src="js/site.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
